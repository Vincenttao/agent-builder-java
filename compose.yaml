name: agent-builder-platform
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  postgres:
    image: postgres:18.1-bookworm@sha256:cc9f4143a8d2fa8cf3749d0cb4d26ecf2d53a77a2ac807e9ebd67ae22426221a
    logging: *default-logging
    environment:
      POSTGRES_USER: builder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local env file}
      POSTGRES_DB: builder
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U builder -d builder"]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    image: agent-builder-app:0.1.0
    logging: *default-logging
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["node", "dist/apps/server/src/migrate.js"]
    environment:
      DATABASE_URL: postgres://builder:${POSTGRES_PASSWORD}@postgres:5432/builder
      MOCK_DATABASE_URL: postgres://builder_mock:${MOCK_DB_PASSWORD}@postgres:5432/builder_mock
      MOCK_DB_PASSWORD: ${MOCK_DB_PASSWORD:?Run scripts/init-local.mjs}
    depends_on:
      postgres:
        condition: service_healthy
  app:
    image: agent-builder-app:0.1.0
    logging: *default-logging
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgres://builder:${POSTGRES_PASSWORD}@postgres:5432/builder
      LOCAL_BOOTSTRAP_TOKEN: ${LOCAL_BOOTSTRAP_TOKEN:?Set LOCAL_BOOTSTRAP_TOKEN}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:8080}
      RUN_EVENT_RETENTION_DAYS: ${RUN_EVENT_RETENTION_DAYS:-90}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      RUNNER_BASE_URL: http://runner:8081
      RUNNER_CONTROL_TOKEN: ${RUNNER_CONTROL_TOKEN:?Run scripts/init-local.mjs}
      TOOL_PROXY_TOKEN: ${TOOL_PROXY_TOKEN:?Run scripts/init-local.mjs}
      MOCK_BASE_URL: http://mock-services:8082
      MOCK_CONTROL_TOKEN: ${MOCK_CONTROL_TOKEN:?Run scripts/init-local.mjs}
      MOCK_SERVICE_TOKEN: ${MOCK_SERVICE_TOKEN:?Run scripts/init-local.mjs}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      runner:
        condition: service_healthy
      mock-services:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
  mock-services:
    image: agent-builder-app:0.1.0
    logging: *default-logging
    command: ["node", "dist/apps/mock-services/src/main.js"]
    environment:
      HOST: 0.0.0.0
      MOCK_PORT: 8082
      MOCK_DATABASE_URL: postgres://builder_mock:${MOCK_DB_PASSWORD}@postgres:5432/builder_mock
      MOCK_CONTROL_TOKEN: ${MOCK_CONTROL_TOKEN}
      MOCK_SERVICE_TOKEN: ${MOCK_SERVICE_TOKEN}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8082/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
  runner:
    image: agent-builder-runner:0.1.0
    logging: *default-logging
    build:
      context: .
      dockerfile: deploy/Runner.Dockerfile
    init: true
    environment:
      HOST: 0.0.0.0
      RUNNER_PORT: 8081
      RUNNER_DATA_ROOT: /data
      JAVA_BRIDGE_JAR: /opt/builder/runtime-bridge.jar
      RUNNER_CONTROL_TOKEN: ${RUNNER_CONTROL_TOKEN}
      TOOL_PROXY_TOKEN: ${TOOL_PROXY_TOKEN}
      TOOL_PROXY_BASE: http://app:8080/internal/tool-proxy
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - runner-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 30
    stop_grace_period: 30s
volumes:
  pg-data:
  runner-data:
