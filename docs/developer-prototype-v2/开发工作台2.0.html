  function files(){return state.role==='platform'?[['platform-skill','moa-platform/SKILL.md',state.platform.platformSkill],['scene-skill','moa-application/SKILL.md',state.platform.skill],['policy','agent/rail/OperationPolicy.java',state.platform.code],['contract','template-contract.json',JSON.stringify({paradigm:'moa-demo-1.0',openParameters:state.platform.openRules?['eligibility','maxQuantity']:['maxQuantity'],assemblyTypes:assemblyTypes(state.platform),toolMethods:['http','mcp','script'],scenarioWritable:['app.config.json','skills/','scripts/'],fixed:['core','runtime','main-handler']},null,2)]]:[['capabilities','capabilities/assembly.json',JSON.stringify({simulation:true,runnable:false,template:state.app.template,allowedTypes:assemblyTypes(state.app),items:capabilities()},null,2)],['flow-routes','orchestration/business-scope.json',flowProjection('routes')],['flow-skills','orchestration/skills.json',flowProjection('skills')],['config','app.config.json',configText()],['instructions','instructions.md',state.app.instructions],['connection','connections/business.json',JSON.stringify({environment:state.app.connection,simulation:true,operations:ops().map(o=>({id:o.id,input:o.input,output:o.output}))},null,2)],['mapping',hasExample()?'scripts/result_balance.py':'scripts/result.py',state.app.script],['business-skill',hasExample()?'skills/ideabean/SKILL.md':'skills/application/SKILL.md',state.app.businessSkill],...capabilityDrafts().filter(d=>['skill','script'].includes(d.method)).map(d=>['capability:'+d.id,d.method==='skill'?`skills/${d.id}/SKILL.md`:`scripts/${d.id}.py`,d.content])];}
  function editorView(){const platform=state.role==='platform';const list=files();const f=list.find(x=>x[0]===(platform?state.platformFile:state.file))||list[0];const draft=state.editDrafts[state.role];return `<div class="section-title"><h2>${platform?'范式工程代码':'工程文件'}</h2><div class="row wrap">${platform?btn(state.platformFile==='scene-skill'?'返回开发 Skill':'返回范式工程','platform-tab','arrow','small',`data-id="${state.platformFile==='scene-skill'?'knowledge':'engineering'}"`):''}${btn('恢复当前文件','restore-code','','small')}${btn('保存代码修改','save-code','check','primary small',['contract','connection','capabilities','flow-routes','flow-skills'].includes(f[0])?'disabled':'')}</div></div><div class="editor"><div class="file-tree"><div class="tree-label">${platform?'MOA PLATFORM':'APPLICATION'}</div>${list.map(x=>`<button class="file-btn ${x[0]===f[0]?'active':''}" data-action="file" data-id="${x[0]}" title="${esc(x[1])}">${ic(x[0].includes('skill')?'book':'file')}<span>${esc(x[1])}</span></button>`).join('')}<div class="tree-label">${platform?'指南与契约固定版本':'范式依赖由平台维护'}</div></div><div class="code-area"><div class="code-bar"><span class="mono">${esc(f[1])}</span>${tag(['contract','connection','capabilities','flow-routes','flow-skills'].includes(f[0])?'只读视图':'可编辑')}</div><textarea class="code-editor" id="code-editor" aria-label="代码编辑器" spellcheck="false" ${['contract','connection','capabilities','flow-routes','flow-skills'].includes(f[0])?'readonly':''}>${esc(draft?.file===f[0]?draft.value:f[2])}</textarea><div class="code-foot"><span><span id="editor-draft-status">${draft?'未保存 · 已在本浏览器暂存 · ':''}</span>${platform?'开发 Skill / 范式工程':'业务 Skill / 应用配置'} · r${revision()}</span><span>UTF-8</span></div></div></div><div class="row between spaced"><span class="tiny muted">${platform?'保存工程草稿；Java 示例不编译、不执行。':'可简单修改配置和脚本。示例脚本只识别预置映射，不执行 Python。'}</span></div>${state.undo&&!platform?`<div class="row spaced">${btn('撤销最近修改','undo','undo','small')}</div>`:''}`;}
  function debugView(){if(!connected())return `<div class="panel pad"><h2>调试准备</h2><p class="spaced">${state.app.connection==='enterprise'?'企业测试环境尚未接入。当前 Demo 不会模拟真实接口成功。':'请先在“开发 → 应用设置 → 连接”中绑定本地 Mock。'}</p>${btn('配置系统接入','tab','link','primary small','data-id="operations"')}${btn('查看运行记录','tab','search','small','data-id="runs"')}</div>`;const run=state.runs.find(r=>r.id===state.activeRun);const approval=state.approval?.runId===run?.id?state.approval:null;return `<div class="section-title"><h2>交互调试</h2>${tag('模拟运行 · 不调用模型','amber')}</div><div class="panel pad"><div class="row between wrap"><div class="field grow"><label for="response-shape">开发者测试设置 · 接口返回夹具</label><select id="response-shape"><option value="standard">标准余额返回</option><option value="nested" ${state.responseShape==='nested'?'selected':''}>接口变更：嵌套余额返回</option></select></div></div>${pendingBusiness()&&pendingBusiness().id!==state.activeRun?`<div class="notice spaced">另有未完成测试 ${esc(pendingBusiness().id)}。${btn('回到未完成测试','resume-pending','arrow','small')}</div>`:''}<div class="debug-grid spaced"><div class="user-simulator"><h3>终端用户模拟器</h3><div class="row wrap mt8">${btn('查余额','preset-query','search','small','data-query="balance"')}${btn('兑换礼品','preset-query','gift','small','data-query="redeem"')}${btn('写后超时','preset-query','clock','small','data-query="timeout"')}</div><p class="tiny mt8">当前扮演业务用户，验证应用体验。这里的输入不会修改应用配置。</p><div class="field spaced"><label for="gift-choice">模拟用户选择的礼品</label><select id="gift-choice"><option value="cup">马克杯 · 200 i豆</option><option value="bag" ${state.debugGift==='bag'?'selected':''}>帆布袋 · 350 i豆</option></select></div><div class="chat-surface">${run?`<div class="bubble user">${esc(run.query)}</div><div class="bubble"><div class="bubble-label">${esc(run.snapshot.application.name)} · 模拟回复</div>${esc(run.answer)}</div>`:`<div class="empty-note">${ic('play')}<p class="mt8">运行当前草稿，查看业务结果与执行步骤。</p><p class="tiny mt8">每次运行自动保留不可变快照。</p></div>`}</div>${approval?`<div class="approval"><   function saveCode(){const list=files(),id=state.role==='platform'?state.platformFile:state.file;const f=list.find(x=>x[0]===id)||list[0];const text=document.querySelector('#code-editor')?.value;
    if(state.editDrafts[state.role]&&state.editDrafts[state.role].baseRevision!==revision()){toast('未保存编辑的基础修订已变化，请恢复当前文件后重新修改。');return;}
    if(!text?.trim()){toast('内容不能为空。');return;}
    if(text===f[2]){clearEditorDraft();persist();toast('没有需要保存的修改。');return;}
    if(text.length>30000){toast('Demo 单文件上限为 30 KB。');return;}
    if(['flow-routes','flow-skills'].includes(id)){toast('编排投影只读，请在编排页编辑同一份定义。');return;}
    if(id==='capabilities'){toast('能力清单是只读视图，请在能力详情中编辑。');return;}
    if(id==='connection'){toast('连接通过“应用设置”维护。');return;}
    if(state.role==='platform'){if(id==='contract'){toast('开放契约通过配置建议维护。');return;}state.platform.rev++;if(id==='scene-skill')state.platform.skill=text;else if(id==='policy')state.platform.code=text;else state.platform.platformSkill=text;}
    else if(id==='config'){
      let data;try{data=JSON.parse(text);}catch{toast('JSON 格式错误，草稿未修改。');return;}
      if(!data||Array.isArray(data)||Object.keys(data).some(k=>!['name','goal','model','rules'].includes(k))||typeof data.name!=='string'||!data.name.trim()||data.name.length>40||typeof data.goal!=='string'||!data.goal.trim()||data.goal.length>500||!['企业默认模型','轻量调试模型'].includes(data.model)||!data.rules||Object.keys(data.rules).some(k=>!['eligibility','maxQuantity'].includes(k))||typeof data.rules.eligibility!=='boolean'||!Number.isInteger(data.rules.maxQuantity)||data.rules.maxQuantity<1||data.rules.maxQuantity>3){toast('仅支持名称、业务目标、模型及已开放规则；数量范围为 1～3。');return;}
      if(data.rules.eligibility&&!state.app.openRules){toast('当前模板尚未开放资格校验，请从平台新模板创建应用。');return;}
      changed('手工修改 app.config.json');Object.assign(state.app,{name:data.name.trim(),goal:data.goal.trim(),model:data.model,eligibility:data.rules.eligibility,maxQuantity:data.rules.maxQuantity});
    }else{changed(`手工修改 ${f[1]}`);if(id==='mapping')state.app.script=text;else if(id==='instructions')state.app.instructions=text;else if(id.startsWith('capability:')){const d=capabilityDrafts().find(d=>d.id===id.slice(11));if(d)d.content=text;}else state.app.businessSkill=text;}
    if(state.role==='platform')recordPlatform('保存代码',f[1]);clearEditorDraft();render();toast('代码草稿已保存；旧建议和旧验证不会覆盖新修订。');
  }
  function addEvent(run,name,status,detail,input={},output={}){run.events.push({name,status,detail,input,output,spanId:(run.events.length+2).toString(16).padStart(16,'0'),parentSpanId:'0000000000000001',durationMs:24+run.events.length*17});}
  function runScenario(){if(!connected()){toast('请先绑定本地 Mock 连接；真实企业接口尚未接入。');return;}if(!hasExample()){toast('当前场景尚未装配业务操作，不能运行 i豆示例。');return;}const query=document.querySelector('#debug-query')?.value.trim()||state.query;state.query=query;
    if(state.approval&&!state.approval.invalid){toast('请先完成或拒绝当前确认，再开始新的业务运行。');return;}
    const unresolved=state.runs.find(r=>r.status==='unknown');if(unresolved){state.activeRun=unresolved.id;render();toast('存在结果未知的兑换，请先查询原交易结果。');return;}
    state.approval=null;const seq=(state.runSequence||0)+1;state.runSequence=seq;const run={id:`demo-run-${String(seq).padStart(3,'0')}`,traceId:'d'.repeat(24)+seq.toString(16).padStart(8,'0'),query,revision:state.app.rev,snapshot:snapshot(),testInput:{query,gift:state.debugGift,responseShape:state.responseShape},events:[],status:'running',simulation:true};
    addEvent(run,'应用快照','ok',`固定草稿 r${run.revision}、模板 ${state.app.template}`,{query},{revision:run.revision,template:state.app.template});
    addEvent(run,'意图与操作选择','ok','MOA 业务链路 · 预设分类，不调用模型',{query},{operation:/兑换|超时/.test(query)?'redeem_gift':'query_balance'});
    const raw=state.responseShape==='nested'?{data:{points:{available:state.business.balance}}}:{points:state.business.balance};
    addEvent(run,'福利接口 · query_balance','ok','本地夹具返回，不发送网络请求',{actor:'demo-user-01'},raw);
    const recognized=mapperReady()||state.app.script.trim()===OLD_SCRIPT.trim();
    if(!recognized||(state.responseShape==='nested'&&!mapperReady())){run.status='failed';run.answer=recognized?'接口已返回数据，但余额映射不符合输出契约。请检查 scripts/result_balance.py。':'脚本已被修改，当前演示器无法验证这段代码。请恢复示例或交给真实执行环境检查。';addEvent(run,'结果映射 · result_balance.py','failed',recognized?'缺少顶层 points；实际字段在 data.points.available':'自定义 Python 未执行',raw,{error:'OUTPUT_CONTRACT_INVALID'});}
    else{addEvent(run,'结果映射与输出校验','ok','可用 i豆字段符合演示契约',raw,{available:state.business.balance,unit:'i豆'});
      if(/兑换|超时/.test(query)){
        if(!state.app.eligibility){run.status='failed';run.answer='兑换前尚未装配资格检查。请通过 Coding Agent 或配置代码补齐。';addEvent(run,'资格校验','failed','缺少资格检查，阻断写入',{}, {writeCount:0});}

        else{run.status='waiting';run.answer='礼品符合兑换条件。请确认礼品和所需 i豆，确认后才会提交。';addEvent(run,'资格校验','ok','余额与数量检查通过',{balance:state.business.balance,gift:state.debugGift},{allowed:true});addEvent(run,'等待用户确认','waiting','确认绑定当前礼品与应用修订',{gift:state.debugGift,revision:state.app.rev},{waiting:true});state.approval={runId:run.id,revision:state.app.rev,gift:state.debugGift,timeout:/超时/.test(query),invalid:false};}
      }else{run.status='succeeded';run.answer=`你当前有 ${state.business.balance} i豆，可选择礼品继续兑换。`;}
    }

  let a2aExample=null;
  function a2aStep(action){
    if(action==='start')a2aExample={status:'waiting_remote',events:['应用 Agent A 委派任务给下游 B，记录 task-demo-B-001 与 context-demo-001。']};
    if(!a2aExample)return;
    const demo=a2aExample;
    if(demo.status==='waiting_remote'&&action==='input'){demo.status='waiting_user';demo.events.push('B 返回需要确认的消息；A 向用户展示确认内容，暂停等待用户。');}
    if(demo.status==='waiting_user'&&action==='confirm'){demo.status='waiting_remote';demo.events.push('用户确认；A 携带原 taskId 与 contextId 向 B 续接，不新建任务。');}
    if(demo.status==='waiting_remote'&&action==='complete'){demo.status='completed';demo.events.push('B 完成；A 的运行时接收结果，恢复原委派并继续后续步骤。');}

  function handoffResume(p){
    if(p.original.phase==='waiting_result'){p.stage='original_waiting';p.events.push('回到原任务查看结果；已提交的操作不能再次执行。');}
    else{p.original.phase='rechecking';p.stage='recheck';p.events.push('回到原任务复核业务条件；旧确认不作为本次授权。');}
  }
  function handoffStep(action){
    const p=state.handoffPreview;if(!p||p.revision!==state.app.rev){toast('应用定义已变化，请重新测试规则。');return;}
    if(p.kind!=='skill'&&handoffError()){toast(handoffError());return;}
    if(action==='keep'&&p.stage==='choice')handoffDelegated(p);
    else if(action==='discard-switch'&&p.stage==='choice'&&p.original.phase!=='waiting_result'){p.original.phase='cancelled';handoffDelegated(p);}
    else if(action==='stay'&&p.stage==='choice'){p.stage='stayed';p.events.push('用户暂不切换，继续原任务；新请求未发出。');}
    else if(['finish','fail'].includes(action)&&p.stage==='delegated'){p.events.push(action==='finish'?'新任务已完成。':'新任务失败，原任务保留状态不受影响。');p.newResult=action==='finish'?'已完成':'失败';handoffFinish(p);}
    else if(action==='resume'&&['offer','deferred'].includes(p.stage))handoffResume(p);
    else if(action==='later'&&p.stage==='offer'){p.stage='deferred';p.events.push('用户选择稍后处理，原任务仍在待办中。');}
    else if(action==='discard'&&['offer','deferred'].includes(p.stage)&&p.original.phase!=='waiting_result'){p.original.phase='cancelled';p.stage='done';p.events.push('用户放弃原任务，不再提示续办。');}
    else if(action==='receipt'&&p.original?.phase==='waiting_result'&&['delegated','offer','deferred','original_waiting'].includes(p.stage)){p.original.phase='completed';p.events.push('原任务 A 收到完成回执；新任务 B 不受影响，没有再次提交。');if(p.stage!=='delegated')p.stage='done';}
    else if(action==='validated'&&p.stage==='recheck'){p.original.phase='waiting_confirmation';p.stage='confirm_again';p.events.push('复核通过，重新向用户确认当前参数。');}
    else if(action==='invalid'&&p.stage==='recheck'){p.original.phase='blocked';p.stage='blocked';p.events.push('复核未通过，原任务没有执行，需要重新处理业务条件。');}
    else if(action==='confirm'&&p.stage==='confirm_again'){p.original.phase='completed';p.stage='done';p.events.push('用户重新确认，原任务演示结束。此处没有真实写入。');}
    else if(action==='skill-input'&&p.stage==='skill_running'){p.original.phase='waiting_input';p.stage='skill_waiting';p.events.push('Skill 等待用户补充信息，仍属于任务 A，没有新增待办。');}
    else if(action==='skill-continue'&&p.stage==='skill_waiting'){p.original.phase='active';p.stage='skill_running';p.events.push('补充信息后继续同一次 Skill 调用。');}
    else if(action==='skill-done'&&p.stage==='skill_running'){p.stage='skill_returned';p.events.push('Skill 返回结果，原任务继续；没有任务出栈或新任务生成。');}
    else return;
    p.events=p.events.slice(-12);render();
  }
  function handoffPreviewView(){
    const p=state.handoffPreview,kind=state.handoffCase||'unfinished',stale=p&&p.revision!==state.app.rev,error=kind==='skill'?(!selectedFlowSkill()?'请先添加业务 Skill。':''):handoffError();
    return `<div class="panel pad spaced"><div class="section-title"><div><h3>验证转交与 Skill 调用规则</h3><p class="tiny mt8">选择一个测试条件，观察已保存配置如何影响用户交互。</p></div>${tag('规则预演 · 无业务执行','amber')}</div><div class="field spaced"><label for="handoff-case">测试条件</label><select id="handoff-case">${[['unfinished','办理中收到范围外请求 · 原任务尚未提交'],['idle','没有进行中任务 · 收到范围外请求'],['inflight','原操作已经提交 · 等待回执时收到范围外请求'],['skill','当前任务调用一个业务 Skill']].map(([id,label])=>`<option value="${id}" ${kind===id?'selected':''}>${label}</option>`).join('')}</select></div>

      <details class="scope-details spaced"><summary>实现状态与测试边界</summary><p>这里读取当前应用的配置，使用固定测试条件模拟一层切换。不是模型判断，也不执行 A2A、Skill、脚本或实际写入，不生成运行/发布证据。MOA 当前只有挂起展示记录，完整检查点恢复与 Native Skill 转交仍待模板实现。</p></details></div>`;
  }
  function handoffSimulation(p,stale){
    const control=(label,id,cls='small')=>btn(label,'handoff-step','',cls,`data-id="${id}" ${stale?'disabled':''}`),original=p.original,activeNew=p.stage==='delegated',originalLabels={suspended:'已暂存 · 待续办',waiting_result:'仍在执行 · 等待回执',cancelled:'已放弃',completed:'已完成',rechecking:'正在复核',waiting_confirmation:'等待确认',active:'正在办理',waiting_input:'等待补充信息',blocked:'复核未通过'};
    const texts={choice:['切换前询问用户',`“${original?.name}”还没办完。要先处理新的请求吗？`],delegated:['新请求已转交',`${p.targetName} 正在处理新请求。${original?.phase==='waiting_result'?'原操作继续执行，回执仍归原任务。':original?.phase==='suspended'?'原任务进度已经保留。':''}`],offer:['新任务已结束',`${p.newResult||'已完成'}。还有“${original?.name}”未结束，是否继续？`],deferred:['原任务留在待办中','用户选择稍后处理，可以从这里再次继续。'],recheck:['回到原任务，先复核','检查业务条件与参数是否仍有效；不会沿用切换前的确认直接提交。'],confirm_again:['复核通过，重新确认','当前参数已重新核对。用户确认后才继续写操作。'],original_waiting:['回到原任务，等待结果','该操作已经提交，只跟踪原回执，不能重复提交。'],blocked:['复核未通过','先解决变化的业务条件，本次不执行业务。'],stayed:['继续原任务','用户暂不切换，没有把新请求发给其他 Agent。'],done:['本次预演结束','已完成或已放弃的任务不再进入待续办列表。'],skill_running:['Skill 在当前任务中执行',`调用“${p.skillName}”，任务仍为 A。可模拟完成，也可查看等待输入的交互。`],skill_waiting:['Skill 等待用户输入','等待状态属于原任务 A；补充后继续同一次调用，不产生任务 B。'],skill_returned:['Skill 已返回，原任务继续','一次调用结束，结果交回原任务；没有新增待办，也不切换接管 Agent。']},message=texts[p.stage]||['',''];
    let actions='';
    if(p.stage==='choice')actions=control('保留原任务并转交','keep','primary small')+(original.phase!=='waiting_result'?control('放弃原任务并转交','discard-switch'):'')+control('暂不切换','stay');
    else if(p.stage==='delegated')actions=control('模拟新任务完成','finish','primary small')+control('模拟新任务失败','fail');
    else if(['offer','deferred'].includes(p.stage))actions=control(original.phase==='waiting_result'?'查看原任务结果':'继续原任务','resume','primary small')+(p.stage==='offer'?control('稍后处理','later'):'')+(original.phase!=='waiting_result'?control('放弃原任务','discard'):'');
    else if(p.stage==='recheck')actions=control('模拟复核通过','validated','primary small')+control('模拟条件已变化','invalid');
    else if(p.stage==='confirm_again')actions=control('模拟用户重新确认','confirm','primary small');
    else if(p.stage==='skill_running')actions=control('模拟 Skill 完成','skill-done','primary small')+control('模拟需要补充信息','skill-input');
    else if(p.stage==='skill_waiting')actions=control('模拟补充信息','skill-continue','primary small');
    if(original?.phase==='waiting_result'&&['delegated','offer','deferred','original_waiting'].includes(p.stage))actions+=control('模拟原任务回执到达','receipt');
    return `<div class="simulation-heading"><span>当前测试 · r${p.revision}</span><span>任务标识只用于本地预演</span></div><div class="simulation-tasks">${original?`<article data-preview-task="A"><span>原任务 A</span><h4>${esc(original.name)}</h4>${tag(originalLabels[original.phase]||'正在办理',original.phase==='suspended'?'amber':'')}<p>${p.kind==='skill'?'执行归属不变，Skill 不生成独立任务。':original.phase==='waiting_result'?'已提交，继续跟踪原回执。':'原业务内容与进度保持关联。'}</p></article>`:'<article><span>原任务</span><h4>没有进行中任务</h4><p>这次转交无需挂起或恢复。</p></article>'}${p.next?`<article data-preview-task="B"><span>新任务 B · ${esc(p.targetName)}</span><h4>${esc(p.next.name)}</h4>${tag(activeNew?'正在办理':p.newResult||'尚未转交',activeNew?'blue':'')}<p>${p.stage==='choice'||p.stage==='stayed'?'等待切换决定。':'由接管 Agent 处理或分派。'}</p></article>`:''}</div><div class="simulation-decision" data-preview-stage="${esc(p.stage)}"><span class="tiny muted">用户会看到的交互 · 模拟</span><h3>${esc(message[0])}</h3><p>${esc(message[1])}</p><div class="row wrap spaced">${actions}</div></div><details class="scope-details spaced"><summary>查看规则执行过程</summary><ol class="simulation-events">${p.events.map(e=>`<li>${esc(e)}</li>`).join('')}</ol></details>`;
  }

    const item=entries[id];if(!item)return;openDialog(item[0],`<p>${item[1]}</p><div class="notice info spaced">完整服务接入、共享审批和权限管理后续完善；这里展示职责与契约，不模拟已接通企业服务。</div>`,btn('关闭','close')+btn(item[2],'capability-open','arrow','primary',`data-id="${item[3]}"`));

  function toolGuidance(){openDialog('需要新工具或 API',`<div class="two responsibility-options"><div class="panel pad"><h3>应用专用工具</h3><p class="mt8">已有连接、API 已获授权且模板已开放扩展时，由应用开发者实现、测试并随应用交付。</p></div><div class="panel pad"><h3>新系统或公共能力</h3><p class="mt8">新系统、新鉴权或公共机制由平台牵头；企业系统方确认授权，应用方提供业务需求。</p></div></div><p class="spaced">可在能力装配中保存 API、MCP 或脚本工具草稿，也可先把需求交给 Coding Agent。草稿不会执行或获得权限，不发起审批。</p><div class="field"><label for="tool-need">希望工具完成什么</label><textarea id="tool-need" rows="3" maxlength="1000" placeholder="说明系统、接口用途与预期结果；请勿填写密钥。"></textarea></div>`,btn('关闭','close')+btn('带到 Coding Agent 继续讨论','tool-draft','spark','primary'));}
  function recordToolNeed(text){const c=currentCoding();c.messages.push({kind:'user',text},{kind:'agent',text:'已记录能力装配与接入需求。本 Demo 尚未实现新能力或 API 的生成与接入，本次讨论未修改工程。已有授权接口与开放契约内的应用专用工具由应用方开发；新系统、新鉴权与公共工具由平台牵头。请补充接口契约、调用身份、授权范围与业务用例。'});c.messages=c.messages.slice(-8);c.draft='';render();focusAgent();}
  function previewApplicationSkill(){openDialog('应用开发者将收到的开发指导',`<div class="notice info">当前模板工程草稿 r${state.platform.rev} · 发行后供新应用使用。已有应用继续引用原固定版本。</div><p class="spaced">这是给 Coding Agent 的开发 Skill，由平台维护；应用方编写自己的业务 Skill。</p><pre class="release-tree spaced">${esc(state.platform.skill)}</pre>`,btn('关闭','close','','primary'));}
  function templatePreview(){openDialog('预览应用开发者创建体验',`<div class="notice info">预览当前工程草稿 r${state.platform.rev}。发行后，新应用才使用这些内容；此操作不会创建应用或切换身份。</div><div class="template-choice spaced">${ic('layers')}<div><strong>MOA 开发模板</strong><small>应用开发者填写自己的应用名称与业务目标</small></div></div><div class="template-description"><h3>开放的装配类型</h3>${assemblyScopeTags(state.platform)}<h3>创建后可修改</h3><p>应用指令、业务 Skill、接口映射及${state.platform.openRules?'资格校验与数量':'数量'}规则。</p><h3>平台继续维护</h3><p>范式机制、公共工具与鉴权接入。模板不预置 i豆业务；应用依据自己的目标选用工具。</p><h3>给 Coding Agent 的指导</h3><pre class="release-tree">${esc(state.platform.skill)}</pre></div>`,btn('关闭','close','','primary'));}
  function focusAgent(){document.querySelector('#agent-prompt')?.focus();}

  function currentUser(){return DEMO_USERS.find(user=>user.role===state.role)||DEMO_USERS[0];}

  function identitySwitcher(){openDialog('切换用户身份',`<p>选择要体验的用户。工作区会根据该用户的身份展示对应功能。</p><div class="identity-list">${DEMO_USERS.map(user=>`<button class="identity-choice ${state.role===user.role?'active':''}" data-action="role" data-role="${user.role}"><span class="avatar">${user.avatar}</span><span class="grow"><strong>${user.name} · ${user.title}</strong><small>${user.team}</small><span class="identity-scope">${user.scope}</span></span>${state.role===user.role?tag('当前用户','red'):ic('arrow')}</button>`).join('')}</div><div class="notice info spaced">演示身份 · 模拟不同用户的使用视角；未接入真实登录与权限服务。切换会保留各自的编辑位置和未保存内容。</div>`,btn('取消','close'));
  }

  function templateDescription(version,skill,scope=state.platform.published){return `<div class="template-description"><h3>可装配能力</h3>${assemblyScopeTags(scope)}<h3>MOA 机制与工程骨架</h3><p>提供意图理解、任务规划、业务操作扩展和结果校验的开发起点。</p><h3>应用开发 Skill</h3><p>指导 Coding Agent 按 MOA 范式开发、接入系统与检查变更。</p><h3>开放代码与配置</h3><p>可维护应用指令、业务 Skill、接口映射和模板开放的规则。</p><p class="tiny mono">MOA ${esc(version)} · ${esc(skill)}</p><p class="tiny">平台团队提供开发起点；应用的名称、业务目标和系统接入由应用开发者定义。业务工具按需求选用，不是模板固有业务。</p></div>`;}

  function templateDetail(){const platform=state.role==='platform',version=platform?state.platform.templateVersion:state.app.template,skill=platform?`moa-application-dev@${state.platform.skillVersion}`:state.app.devSkill;openDialog(platform?'已发行模板 · 只读说明':'应用模板来源 · 只读',`<div class="notice info">${platform?'此版本供应用开发者在新建应用时选择。模板维护与发行在平台工作区完成。':'这是创建当前应用时固定的模板版本。平台发行新版不会自动替换当前应用。'}</div><div class="spaced">${templateDescription(version,skill,platform?state.platform.published:state.app)}</div><p class="tiny">这是开发模板说明，不是业务应用或运行实例。当前 Demo 不执行真实模型或 Java。</p>`,btn('关闭','close','','primary'));}

  const preserveEditor=new Set(['add-capability','choose-capability','edit-capability','capability-to-agent','tool-guidance','tool-draft','capability-detail','preview-application-skill','template-preview','identity-switcher','template-detail','view','role','resume-app','open-app-page','app-switcher','switch-app','all-apps','create-app','create-confirm','save-code','restore-code','skill-detail','review-proposal','close','tour','reset-request','reset-confirm']);

  document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;
    if(editorBuffer!==null&&!preserveEditor.has(a)){toast('代码有未保存修改，请先保存或恢复当前文件。');return;}
    switch(a){
      case 'handoff-save':saveHandoff();break;
      case 'handoff-save-preview':saveHandoff(true);break;
      case 'handoff-open':state.handoffCase=(state.flowContext||'new')==='new'?'idle':'unfinished';openHandoffPreview();break;
      case 'handoff-test':previewHandoffStart();break;
      case 'handoff-step':handoffStep(b.dataset.id);break;
      case 'handoff-file':openDevelopment('files','flow-routes');break;
      case 'preview-mode':state.flowPreviewMode=b.dataset.id;render();break;
      case 'skill-preview':state.handoffCase='skill';openHandoffPreview();break;
      case 'scope-save':saveBusinessScope();break;
      case 'map-select':state.flowMapNode=b.dataset.id;render();document.querySelector(`[data-map-node="${state.flowMapNode}"]`)?.focus({preventScroll:true});break;
      case 'map-example':state.flowQuery=b.dataset.query;state.flowContext=b.dataset.context||'new';state.flowPreview=null;state.flowMapNode=null;render();previewFlow();break;
      case 'flow-section':state.flowSection=b.dataset.id;render();break;
      case 'flow-edit':editFlowRoute(b.dataset.id);break;
      case 'flow-save':saveFlowRoute();break;
      case 'flow-remove':removeFlowRoute(b.dataset.id);break;
      case 'flow-remove-confirm':removeFlowRoute(b.dataset.id,true);break;
      case 'flow-save-process':saveFlowProcess();break;
      case 'flow-preview':previewFlow();break;
      case 'flow-choose':previewFlow(b.dataset.id);break;
      case 'flow-clean':{const ids=flowOrphans();if(ids.length){const def=clone(flowDefinition());for(const id of ids)delete def.skills[id];changed('清理失效 Skill 的操作绑定');state.app.orchestration=def;render();}break;}
      case 'flow-agent':flowToAgent();break;
      case 'flow-use':{const c=capabilities().find(c=>c.id===b.dataset.id);if(c?.type==='skill'&&state.formDrafts.flow&&state.formDrafts.flow.skillId!==c.id){toast('请先保存或放弃当前 Skill 的暂存。');break;}state.flowSection=c?.type==='remote'?'routes':'process';if(c?.type==='skill')state.flowSkillId=c.id;openDevelopment('orchestration');break;}
      case 'flow-skill':if(state.formDrafts.flow&&state.formDrafts.flow.skillId!==b.dataset.id){toast('请先保存或放弃当前 Skill 的暂存。');break;}state.flowSkillId=b.dataset.id;state.flowSection='process';openDevelopment('orchestration');break;
      case 'flow-skill-file':openDevelopment('files',b.dataset.id==='builtin-skill'?'business-skill':'capability:'+b.dataset.id);break;
      case 'flow-example':{const r=flowDefinition().routes.find(r=>r.id===b.dataset.id);state.flowQuery=r?.utterances[0]||r?.keywords[0]||'';state.flowSection='preview';state.flowPreviewMode='input';state.flowContext='new';state.flowPreview=null;render();previewFlow();break;}
      case 'capability-filter':state.capabilityFilter=b.dataset.id;state.selectedCapability=null;render();break;
      case 'select-capability':{const d=capabilities().find(d=>d.id===b.dataset.id);if(d){state.selectedCapability=d.id;if(state.capabilityFilter!=='all'&&state.capabilityFilter!==d.type)state.capabilityFilter='all';openDevelopment('capabilities');}break;}
      case 'capability-file':{const d=capabilityDrafts().find(d=>d.id===b.dataset.id);if(d&&['skill','script'].includes(d.method))openDevelopment('files','capability:'+d.id);break;}
      case 'a2a-example':a2aStep('start');break;
      case 'a2a-step':a2aStep(b.dataset.id);break;
      case 'assembly-file':openDevelopment('files','capabilities');break;
      case 'add-capability':chooseCapability();break;
      case 'choose-capability':editCapability(null,b.dataset.type);break;
      case 'edit-capability':editCapability(b.dataset.id);break;
      case 'save-capability':saveCapability();break;
      case 'remove-capability':removeCapability(b.dataset.id);break;
      case 'remove-capability-confirm':removeCapability(b.dataset.id,true);break;
      case 'capability-to-agent':capabilityToAgent(b.dataset.id);break;
      case 'save-assembly-scope':saveAssemblyScope();break;
      case 'tool-guidance':toolGuidance();break;
      case 'tool-draft':{const value=document.querySelector('#tool-need').value.trim();if(!value){toast('请描述需要的工具用途。');document.querySelector('#tool-need').focus();break;}currentCoding().draft='新增工具/API 需求：'+value;closeDialog();render();focusAgent();break;}
      case 'capability-detail':capabilityDetail(b.dataset.id);break;
      case 'capability-open':state.platformTab=b.dataset.id;if(b.dataset.id==='code')state.platformFile='contract';closeDialog();render();break;
      case 'preview-application-skill':previewApplicationSkill();break;
      case 'template-preview':templatePreview();break;
      case 'identity-switcher':identitySwitcher();break;
      case 'template-detail':templateDetail();break;
      case 'role':if(DEMO_USERS.some(user=>user.role===b.dataset.role)){state.role=b.dataset.role;closeDialog();render();}break;
      case 'resume-app':openApplication(b.dataset.id||state.activeAppId);break;
      case 'open-app-page':openApplication(b.dataset.id,b.dataset.tab);break;
      case 'app-switcher':appSwitcher();break;
      case 'switch-app':openApplication(b.dataset.id);break;
      case 'all-apps':state.view='apps';closeDialog();render();break;
      case 'dev-section':openDevelopment(b.dataset.id);break;
      case 'instruction-file':openDevelopment('files','instructions');break;
      case 'edit-business-skill':openDevelopment('files','business-skill');break;
      case 'focus-agent':focusAgent();break;
      case 'test-mode':setAppTab('debug');state.testMode=b.dataset.id;render();break;
      case 'save-instructions':{if(!formRevisionValid('instructions'))break;const value=document.querySelector('#app-instructions').value,model=document.querySelector('#instruction-model').value;if(value!==state.app.instructions||model!==state.app.model){changed('修改角色与行为');state.app.instructions=value;state.app.model=model;}delete state.formDrafts.instructions;render();toast('角色与行为已保存。');break;}
      case 'save-rules':{if(!formRevisionValid('rules'))break;const eligibility=document.querySelector('#eligibility-rule').value==='true',maxQuantity=Number(document.querySelector('#max-quantity').value);if(eligibility&&!state.app.openRules){toast('当前模板没有开放资格校验。');break;}if(eligibility!==state.app.eligibility||maxQuantity!==state.app.maxQuantity){changed('修改业务规则');state.app.eligibility=eligibility;state.app.maxQuantity=maxQuantity;}delete state.formDrafts.rules;render();toast('业务规则已保存。');break;}
      case 'run-snapshot':showRunSnapshot(b.dataset.id,b.dataset.app);break;
      case 'release-detail':showRelease(b.dataset.version);break;
      case 'fix-check':fixCheck(b.dataset.id);break;
      case 'resume-pending':{const run=pendingBusiness();state.view='workspace';state.tab='debug';state.testMode='interactive';if(run)state.activeRun=run.id;render();break;}
      case 'discard-form':delete state.formDrafts[b.dataset.id];render();break;
      case 'tab':setAppTab(b.dataset.id);render();break;
      case 'view':state.role='scene';state.view=b.dataset.id;render();break;
      case 'platform-tab':state.platformTab=b.dataset.id;render();break;
      case 'platform-code':state.platformTab='code';if(state.editDrafts.platform)state.platformFile=state.editDrafts.platform.file;render();break;
      case 'edit-dev-skill':state.platformTab='code';state.platformFile='scene-skill';render();break;
      case 'file':if(state.role==='platform')state.platformFile=b.dataset.id;else state.file=b.dataset.id;render();break;
      case 'open-code':openDevelopment('files','config');break;
      case 'edit-mapping':openDevelopment('files','mapping');break;
      case 'goto-debug':setAppTab('debug');state.testMode='interactive';render();break;
      case 'select-op':state.selectedOp=b.dataset.id;openDevelopment('tools');break;
      case 'save-config':{if(!formRevisionValid('meta'))break;const name=document.querySelector('#app-name')?.value.trim();const model=document.querySelector('#model')?.value??state.app.model;if(!name){toast('应用名称不能为空。');break;}if(name!==state.app.name||model!==state.app.model){changed('修改应用配置');Object.assign(state.app,{name,model});}delete state.formDrafts.meta;render();toast('应用配置已保存。');break;}
      case 'save-connection':{if(!formRevisionValid('connection'))break;const value=document.querySelector('#connection')?.value;const connection=value==='none'?'未绑定':value;if(connection!==state.app.connection){changed('修改业务连接');state.app.connection=connection;}delete state.formDrafts.connection;render();toast('连接配置已保存。');break;}
      case 'save-code':saveCode();break;
      case 'restore-code':clearEditorDraft();render();toast('已恢复到当前保存的文件。');break;
      case 'undo':if(state.undo){const rev=state.app.rev+1,previous=clone(state.undo);changed('撤销');state.app={...clone(DEFAULT.app),...previous,rev,lastChange:'撤销最近修改'};state.undo=null;render();toast('已撤销；新修订需要重新检查。');}break;
      case 'suggest':prepareProposal(b.dataset.kind);break;
      case 'ask-agent':askAgent();break;
      case 'review-proposal':reviewProposal();break;
      case 'apply-proposal':applyProposal();break;
      case 'discard-proposal':currentCoding().proposal=null;render();break;
      case 'skill-detail':skillDetail();break;
      case 'preset-query':state.query={balance:'查询我的 i豆余额',redeem:'帮我兑换这个礼品',timeout:'兑换礼品，模拟写后超时'}[b.dataset.query];render();break;
      case 'run':runScenario();break;
      case 'confirm':confirmRedemption();break;
      case 'reject':{const r=state.runs.find(x=>x.id===state.approval?.runId);if(r){r.status='rejected';r.answer='用户拒绝，本次没有提交兑换。';addEvent(r,'用户拒绝','rejected','未调用写操作',{}, {writeCount:0});}state.approval=null;render();break;}
      case 'reconcile':{const r=state.runs.find(x=>x.id===state.activeRun);if(r?.status!=='unknown')break;const order=state.business.orders.find(o=>o.key===r.id);if(order){r.status='succeeded';r.answer=`原交易已成功：${order.id}。核对没有新增订单。`;addEvent(r,'核对原兑换结果','ok','只查询原业务标识，没有再次写入',{idempotencyKey:r.id},{orderId:order.id,status:order.status});}render();break;}
      case 'debug-fix':{const r=state.runs.find(x=>x.id===state.activeRun);prepareProposal(r?.events.some(e=>e.name.includes('映射')&&e.status==='failed')?'mapping':'eligibility');break;}

      case 'reset-request':openDialog('重置本 Demo','<p>只清除本设计稿的草稿、对话、模拟订单和运行记录，回到初始状态。</p>',btn('取消','close')+btn('确认重置','reset-confirm','','primary'));break;
      case 'reset-confirm':closeDialog();state=clone(DEFAULT);state.applications={};state.applicationSequence=0;state.activeAppId=null;state.editDrafts={};state.formDrafts={};state.candidateHistory=[];state.deliveryHistory=[];state.platform.activity=[];state.platform.releases=[{version:state.platform.templateVersion,skillVersion:state.platform.skillVersion,...clone(state.platform.published),simulation:true}];editorBuffer=null;playback=null;render();break;
      case 'trace':traceDialog(b.dataset.id||state.activeRun,b.dataset.app||state.activeAppId);break;

      case 'replay-play':stopPlayback();if(playback.index===findRun(playback.runId,playback.appId).events.length-1)playback.index=0;playback.playing=true;renderReplay();playTimer=setTimeout(playStep,900);break;
      case 'replay-pause':stopPlayback();renderReplay();break;
      case 'close':closeDialog();break;
    }
  });
  document.addEventListener('input',event=>{if(['scope-description','scope-outside'].includes(event.target.id))captureBoundaryDraft();if(event.target.id==='flow-query'){state.flowQuery=event.target.value;persist();const result=document.querySelector('.flow-preview');if(result&&state.flowPreview)result.innerHTML='<div class="notice spaced">预演输入已变化，请重新预演。</div>';refreshFlowMap();}if(event.target.id==='flow-content'||event.target.closest('.flow-operation'))captureFlowDraft();if(event.target.id==='app-search'){const text=event.target.value.toLowerCase();document.querySelectorAll('.switcher-item').forEach(b=>{b.hidden=!b.dataset.name.toLowerCase().includes(text);});}if(event.target.id==='app-instructions'){state.formDrafts.instructions={value:event.target.value,model:document.querySelector('#instruction-model').value,baseRevision:state.formDrafts.instructions?.baseRevision??state.app.rev};persist();}if(event.target.id==='agent-prompt'){currentCoding().draft=event.target.value;persist();}if(event.target.id==='code-editor'){const file=state.role==='platform'?state.platformFile:state.file;const saved=files().find(f=>f[0]===file)?.[2];if(event.target.value===saved)clearEditorDraft();else{editorBuffer=event.target.value;state.editDrafts[state.role]={file,value:editorBuffer,baseRevision:revision()};}const status=document.querySelector('#editor-draft-status');if(status)status.textContent=editorBuffer!==null?'未保存 · 已在本浏览器暂存 · ':'';persist();}if(event.target.id==='app-name'){state.formDrafts.meta={name:event.target.value,model:(document.querySelector('#model')?.value??state.app.model),baseRevision:state.app.rev};persist();}if(event.target.id==='debug-query'){state.query=event.target.value;persist();}});
  document.addEventListener('change',event=>{if(event.target.id==='handoff-target'||event.target.name?.startsWith('handoff-'))captureHandoffDraft();if(event.target.id==='handoff-case'){state.handoffCase=event.target.value;state.handoffPreview=null;render();}if(event.target.id==='flow-context'){state.flowContext=event.target.value;render();}if(event.target.id==='flow-skill-select'){if(state.formDrafts.flow){toast('请先保存或放弃当前 Skill 的暂存。');event.target.value=state.formDrafts.flow.skillId;}else{state.flowSkillId=event.target.value;render();}}if(event.target.closest('.flow-operation'))captureFlowDraft();if(event.target.id==='capability-method')updateCapabilityFields();if(['eligibility-rule','max-quantity'].includes(event.target.id)){state.formDrafts.rules={eligibility:document.querySelector('#eligibility-rule').value==='true',maxQuantity:Number(document.querySelector('#max-quantity').value),baseRevision:state.formDrafts.rules?.baseRevision??state.app.rev};persist();}if(event.target.id==='instruction-model'){state.formDrafts.instructions={value:document.querySelector('#app-instructions').value,model:event.target.value,baseRevision:state.formDrafts.instructions?.baseRevision??state.app.rev};persist();}if(event.target.id==='diagnostic-app'){state.platform.appFilter=event.target.value;render();}if(event.target.id==='run-filter'){if(state.role==='platform')state.platform.runFilter=event.target.value;else state.runFilter=event.target.value;render();}if(event.target.id==='connection'){state.formDrafts.connection={value:event.target.value,baseRevision:state.app.rev};persist();}if(event.target.id==='model'){state.formDrafts.meta={name:document.querySelector('#app-name').value,model:event.target.value,baseRevision:state.app.rev};persist();}if(event.target.id==='response-shape'){state.responseShape=event.target.value;persist();}if(event.target.id==='gift-choice'){state.debugGift=event.target.value;if(state.approval){state.approval.invalid=true;const run=state.runs.find(r=>r.id===state.approval.runId);if(run?.status==='waiting'){run.status='invalidated';run.answer='模拟用户更换礼品，原确认失效。请重新发起测试。';addEvent(run,'确认失效','invalidated','测试输入变化，应用修订不变',{}, {writeCount:0});}}render();}});
  document.querySelector('#dialog').addEventListener('cancel',stopPlayback);
  render();
  if(demoDataReset)toast('Demo 已更新，旧应用、草稿和演示记录已清空。');
})();

</script>
</body>
</html>
