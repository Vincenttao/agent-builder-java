<body>

  <script>
(() => {
  'use strict';
  const KEY = 'openjiuwen-workbench-v2-demo-3';
  const SOURCE = 'agent-solution · guides/docs-java';
  const OLD_SCRIPT = 'def transform(raw):\n    available = raw["points"]\n    return {"available": available, "unit": "i豆"}\n';
  const FIXED_SCRIPT = 'def transform(raw):\n    # 兼容标准接口与企业嵌套返回\n    if "data" in raw:\n        available = raw["data"]["points"]["available"]\n    else:\n        available = raw["points"]\n    return {"available": available, "unit": "i豆"}\n';
  const SCENE_SKILL = '---\nname: moa-scene-development\ndescription: 基于 MOA 模板辅助编排业务操作与局部扩展\n---\n\n# 场景开发指导（设计示例）\n\n1. 读取当前模板、操作契约和应用修订。\n2. 优先配置与组合已开放操作，不重写执行循环。\n3. 新增意图时核对候选、路由与下游名称。\n4. 修改映射或校验时先检查输入输出 Schema。\n5. 写操作必须保留资格校验、参数绑定确认与幂等。\n6. 展示编排和文件差异，再应用到同一工程。\n7. 运行相关组件与业务检查，保留失败记录。\n\n可写：app.config.json、skills/、scripts/\n只读：范式核心、Core/Runtime 依赖、独立验收断言\n\n参考：MOA_Agent开发方式指南 3.1–3.5\n参考：guides/docs-java/conventions/project-structure.md\n\n此文件仅用于展示开发 Skill 的内容，不是已验证的 OpenCode 发行包。\n';
  const PLATFORM_SKILL = '---\nname: moa-platform-development\ndescription: 维护范式工程、公开扩展契约与场景开发 Skill\n---\n\n# 平台开发指导（设计示例）\n\n1. 锁定发布 POM、框架版本和文档修订。\n2. 确认缺口：先检查公开 API、配置和已有 Provider。\n3. 选择公开 SPI，读取完整输入输出和生命周期契约。\n4. agent/ 保存 Agent 语义，service/ 保存托管和装配。\n5. 明确 Bean/Factory 注册，不复制主循环或 Controller。\n6. 区分组件、装配、契约与真实协议检查。\n7. 发布范式、场景开发 Skill 与模板；记录兼容性。\n\n参考：quick-start/extend-openjiuwen.md（七步法）\n参考：spi/contract-testing.md\n\n此文件是设计内容示例；真实装载、API 和版本兼容仍需验证。\n';
  const GUARD_CODE = '// 范式工程草稿 · 仅展示编辑，不编译或执行\npackage com.enterprise.ideabean.agent.rail;\n\npublic final class RedemptionPolicy {\n    private final int maxQuantity;\n\n    public RedemptionPolicy(int maxQuantity) {\n        this.maxQuantity = maxQuantity;\n    }\n\n    public boolean allows(int quantity) {\n        return quantity > 0 && quantity <= maxQuantity;\n    }\n}\n\n// 此处是纯 Java 规则示例。\n// 接入具体 Rail 钩子与 service/ 装配由选定范式契约决定。\n';
  const BUSINESS_SKILL = '# i豆服务\n\n查询本人可用 i豆，展示可兑换礼品。\n兑换前核对资格并向用户展示礼品、数量和所需 i豆。\n用户确认后提交，结果未知时按原业务标识核对。\n\n只使用已登记业务操作；不从对话中接受身份或接口地址。\n';
  const ICONS = {
    grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
    layers:'<path d="m12 3 10 5-10 5L2 8zM2 12l10 5 10-5M2 16l10 5 10-5"/>',
    flow:'<rect x="3" y="3" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M6 8v10h9M9 5h9v11"/>',
    link:'<path d="m10 13 4-4M8 16l-1 1a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0m0 2 1-1a4 4 0 0 1 6 6l-5 5a4 4 0 0 1-6 0" transform="translate(2 0)"/>',
    code:'<path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-15-2 18"/>',
    play:'<path d="m6 3 15 9-15 9z"/>',
    box:'<path d="m12 2 9 5v10l-9 5-9-5V7zM3 7l9 5 9-5m-9 5v10M7 4l10 6"/>',
    spark:'<path d="m12 2 2.7 7.3L22 12l-7.3 2.7L12 22l-2.7-7.3L2 12l7.3-2.7z"/>',
    book:'<path d="M12 5v16M12 5C8 2 4 3 2 4v15c4-2 7-1 10 2 3-3 6-4 10-2V4c-2-1-6-2-10 1z"/>',
    file:'<path d="M5 2h9l5 5v15H5zM14 2v6h5M8 12h8m-8 4h8"/>',
    lock:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4m-4 5v2"/>',
    check:'<path d="m5 12 4 4L19 6"/>',
    arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',
    up:'<path d="M12 20V4m-7 7 7-7 7 7"/>',
    undo:'<path d="M4 9h10a6 6 0 0 1 0 12M4 9l5-5M4 9l5 5"/>',
    settings:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/>',
    people:'<circle cx="9" cy="7" r="4"/><path d="M2 21v-3a7 7 0 0 1 14 0v3M17 3a4 4 0 0 1 0 8m2 3a6 6 0 0 1 3 5v2"/>',
    plus:'<path d="M12 4v16M4 12h16"/>',
    close:'<path d="m6 6 12 12M6 18 18 6"/>',
    gift:'<rect x="3" y="9" width="18" height="5" rx="1"/><path d="M5 14v7h14v-7M12 9v12M12 9C3 9 5 0 9 4l3 5c9 0 7-9 3-5z"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',
    search:'<circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/>'
  };
  const ic = name => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ICONS.file}</svg>`;
  const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const clone = v => JSON.parse(JSON.stringify(v));
  const tag = (text,tone='') => `<span class="tag ${tone}">${esc(text)}</span>`;
  const btn = (label,action,icon='',cls='',attrs='') => `<button class="btn ${cls}" data-action="${action}" ${attrs}>${icon?ic(icon):''}${label}</button>`;
  const DEFAULT = {
    schema:3,role:'scene',tab:'overview',platformTab:'engineering',view:'workspace',file:'config',platformFile:'platform-skill',
    app:{name:'i豆服务助手',rev:1,template:'1.2.0',devSkill:'moa-scene-dev@demo-1.0',devSkillContent:SCENE_SKILL,openRules:false,eligibility:false,maxQuantity:1,model:'企业默认模型',connection:'企业福利接口 · 演示',script:OLD_SCRIPT,businessSkill:BUSINESS_SKILL,gift:'cup'},
    platform:{rev:1,skill:SCENE_SKILL,platformSkill:PLATFORM_SKILL,code:GUARD_CODE,openRules:false,checked:0,templateVersion:'1.2.0',skillVersion:'demo-1.0'},
    coding:{scene:{messages:[],proposal:null},platform:{messages:[],proposal:null}},
    responseShape:'standard',query:'查询我的 i豆余额',runs:[],activeRun:null,approval:null,business:{balance:1280,orders:[]},report:null,candidate:null,delivery:null,undo:null
  };
  let state, storageUnavailable=false;
  try { const parsed=JSON.parse(localStorage.getItem(KEY)); state=parsed?.schema===3&&parsed.app&&parsed.platform&&parsed.coding?parsed:clone(DEFAULT); }
  catch { state=clone(DEFAULT); storageUnavailable=true; }
  let editorBuffer=null, toastTimer;
  const gifts={cup:{name:'简约马克杯',cost:200},bag:{name:'帆布通勤袋',cost:350}};
  const sceneNav=[['overview','flow','模板与编排'],['operations','link','业务操作与连接'],['extensions','code','代码与场景扩展'],['debug','play','联合调试'],['delivery','box','测试与交付']];
  const platformNav=[['engineering','code','范式工程'],['capabilities','layers','公共能力'],['knowledge','book','开发 Skill'],['publish','box','模板发行'],['diagnostics','search','联合诊断']];
  function persist(){ try{localStorage.setItem(KEY,JSON.stringify(state));}catch{storageUnavailable=true;} }
  function toast(text){const el=document.querySelector('#toast');el.textContent=text;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),4200);}
  function revision(){return state.role==='scene'?state.app.rev:state.platform.rev;}
  function currentCoding(){return state.coding[state.role];}
  function snapshot(){return clone({application:state.app,revision:state.app.rev,simulation:true});}
  function changed(reason){state.undo=clone(state.app);state.app.rev++;if(state.approval){state.approval.invalid=true;const r=state.runs.find(x=>x.id===state.approval.runId);if(r&&r.status==='waiting'){r.status='invalidated';r.answer='应用或兑换参数已变化，原确认失效，未提交兑换。';addEvent(r,'确认失效','invalidated','请按新参数重新运行',{}, {writeCount:0});}}state.app.lastChange=reason;}
  function mapperReady(){return state.app.script.trim()===FIXED_SCRIPT.trim();}
  function reportCurrent(){return state.report?.revision===state.app.rev&&state.report.passed;}
  function ops(){return [
    {id:'query_balance',name:'查询 i豆',kind:'只读查询',icon:'search',desc:'从福利系统获取当前用户余额',input:'身份由企业入口提供',output:'{ available: 1280, unit: "i豆" }'},
    {id:'list_gifts',name:'选择礼品',kind:'业务操作',icon:'gift',desc:'选择可兑换礼品与数量',input:'礼品目录与可用库存',output:'{ giftId, pointsRequired, stock }'},
    ...(state.app.eligibility?[{id:'check_eligibility',name:'资格校验',kind:'新增规则',icon:'check',desc:'确认前核对余额、库存与数量',input:'当前礼品、余额及结果版本',output:'{ allowed: true, reason: null }'}]:[]),
    {id:'confirm',name:'用户确认',kind:'交互节点',icon:'people',desc:'展示礼品和所需 i豆，绑定本次参数',input:'当前主体、礼品、数量、配置修订',output:'确认后继续；改变礼品使确认失效'},
    {id:'redeem_gift',name:'提交兑换',kind:'需要确认',icon:'box',desc:'使用业务幂等标识提交兑换',input:'已确认的参数和幂等标识',output:'{ orderId, status: "succeeded" }'},
    {id:'query_redemption',name:'查询回执',kind:'结果核对',icon:'file',desc:'写入未知时查询原交易结果',input:'订单或原业务幂等标识',output:'成功 / 拒绝 / 处理中 / 结果未知'}
  ];}
  let selectedOp='query_balance';
  function navItem(id,icon,label,active,action='tab'){return `<button class="nav-btn ${active?'active':''}" data-action="${action}" data-id="${id}">${ic(icon)}<span>${label}</span></button>`;}
  function render(){
    persist();const platform=state.role==='platform';
    document.querySelector('#root').innerHTML=`<aside class="sidebar"><div class="brand">${ic('layers')}openJiuwen</div><div class="brand-caption">AGENT DEVELOPMENT</div><div class="space"><span class="square">企</span><span>企业 AI 开发空间</span><span class="muted">⌄</span></div><div class="nav-label">${platform?'平台开发':'场景开发'}</div><nav>${platform?platformNav.map(([id,i,l])=>navItem(id,i,l,state.platformTab===id,'platform-tab')).join(''):navItem('apps','grid','我的应用',state.view==='apps','view')+navItem('templates','layers','场景模板',state.view==='templates','view')}</nav>${platform?'':`<div class="nav-label">当前应用 · i豆</div><nav>${sceneNav.map(([id,i,l])=>navItem(id,i,l,state.view==='workspace'&&state.tab===id)).join('')}</nav>`}<div class="sidebar-bottom">${btn('演示路线','tour','play','ghost small')}<div class="tiny muted mt8">PRD 2.0 · 可点击 Demo<br>本地数据，不连接业务后端</div><div class="user"><div class="avatar">${platform?'林':'陈'}</div><div><strong class="tiny">${platform?'林知远 · 平台开发者':'陈晓 · 场景开发者'}</strong><p class="tiny">${platform?'范式与公共能力维护':'企业福利业务团队'}</p></div></div></div></aside><main class="main"><header class="topbar"><div class="crumb">企业空间 <span>/</span> 开发态 <span>/</span> <strong>${platform?'平台工作区':'场景工作区'}</strong></div><div class="row">${tag('交互 Demo · 全部为模拟数据','amber')}<div class="role-switch" role="group" aria-label="切换工作区"><button data-action="role" data-role="scene" class="${!platform?'active':''}" aria-pressed="${!platform}">场景开发者</button><button data-action="role" data-role="platform" class="${platform?'active':''}" aria-pressed="${platform}">平台开发者</button></div></div></header>${pageHead()}<div class="work-layout"><section class="canvas-main" id="workspace" tabindex="-1">${platform?platformView():state.view==='apps'?appsView():state.view==='templates'?templatesView():sceneView()}<div class="footer-caption"><span>${storageUnavailable?'浏览器存储不可用 · 本次数据仅在页面内保留':'草稿保存在本浏览器 · 不上传数据'}</span><span>DESIGN PROTOTYPE / 2.0</span></div></section>${copilot()}</div></main>`;
  }
  function pageHead(){const platform=state.role==='platform';const title=platform?({engineering:'MOA 企业协同范式',capabilities:'公共能力',knowledge:'范式开发 Skill',publish:'场景模板发行',code:'范式工程代码',diagnostics:'应用执行与 Trace'}[state.platformTab]):state.view==='apps'?'我的应用':state.view==='templates'?'从场景模板开始':esc(state.app.name);
    return `<div class="page-head"><div class="row between"><div class="row"><div class="app-avatar">${platform?ic('layers'):'豆'}</div><div><div class="eyebrow">${platform?'PLATFORM ENGINEERING':'SCENARIO DEVELOPMENT'}</div><h1>${title}</h1></div></div><div class="row head-actions">${platform?btn('查看工程代码','platform-code','code')+btn('检查开放契约','platform-check','check','primary'):btn('查看代码','open-code','code')+btn('调试应用','goto-debug','play','primary')}</div></div><p class="lead">${platform?'把二次开发方法、公共能力与扩展边界交付给场景团队。':'基于 MOA 模板，用业务编排和少量代码完成 i豆场景。'}</p><div class="head-tags">${tag(platform?'平台工程':'应用草稿','red')}${tag(platform?'范式 demo-1.0':`模板 ${state.app.template}`)}<span class="tiny muted">${platform?`工程修订 r${state.platform.rev}`:`草稿 r${state.app.rev} · 业务团队维护`}</span><span class="mono tiny muted">${platform?'agent/ → service/ → resources/':'ideabean-assistant'}</span></div></div>`;

  function copilot(){const platform=state.role==='platform';const c=currentCoding();const proposal=c.proposal;const examples=platform?[['scope','开放场景可配置的资格校验'],['guide','补充二开验证步骤']]:[['eligibility','兑换前增加资格校验'],['mapping','适配新的余额接口返回'],['wording','调整兑换确认说明']];

  function debugView(){const run=state.runs.find(r=>r.id===state.activeRun);const approval=state.approval?.runId===run?.id?state.approval:null;return `<div class="section-title"><h2>联合调试</h2>${tag('模拟运行 · 不调用模型','amber')}</div><div class="panel pad"><div class="row between wrap"><div class="field grow"><label for="response-shape">接口返回夹具</label><select id="response-shape"><option value="standard">标准余额返回</option><option value="nested" ${state.responseShape==='nested'?'selected':''}>接口变更：嵌套余额返回</option></select></div><div class="field" style="min-width:135px"><label for="gift-choice">本次兑换礼品</label><select id="gift-choice"><option value="cup">马克杯 · 200 i豆</option><option value="bag" ${state.app.gift==='bag'?'selected':''}>帆布袋 · 350 i豆</option></select></div></div><div class="row wrap mt8">${btn('查余额','preset-query','search','small','data-query="balance"')}${btn('兑换礼品','preset-query','gift','small','data-query="redeem"')}${btn('写后超时','preset-query','clock','small','data-query="timeout"')}</div><div class="debug-grid spaced"><div><div class="chat-surface">${run?`<div class="bubble user">${esc(run.query)}</div><div class="bubble"><div class="bubble-label">i豆服务助手 · 模拟回复</div>${esc(run.answer)}</div>`:`<div class="empty-note">${ic('play')}<p class="mt8">运行当前草稿，查看业务结果与执行步骤。</p><p class="tiny mt8">每次运行自动保留不可变快照。</p></div>`}</div>${approval?`<div class="approval"><h3>${approval.invalid?'确认已失效':'请确认本次兑换'}</h3><p>${esc(gifts[approval.gift].name)} · 1 件 · ${gifts[approval.gift].cost} i豆</p><p class="tiny mt8">绑定草稿 r${approval.revision} 和当前礼品。${approval.invalid?'参数已变化，请重新运行后确认。':'确认后才提交兑换。'}</p><div class="row wrap">${btn('确认兑换','confirm','check','primary small',approval.invalid?'disabled':'')}${btn('拒绝','reject','','small')}</div></div>`:''}${run?.status==='unknown'?`<div class="notice spaced">结果未知，请按原业务标识核对。${btn('查询兑换结果','reconcile','search','small')}</div>`:''}<div class="debug-control"><input class="input" id="debug-query" aria-label="调试消息" value="${esc(state.query)}">${btn('运       guide:{title:'补充二开验证配方',files:['moa-platform/SKILL.md'],before:state.platform.platformSkill,after:state.platform.platformSkill+'\n## 本轮验证配方\n- Unit：检查参数、映射与确定性规则\n- Assembly：核对 Bean/Factory 注册\n- Contract：正常、拒绝、超时、幂等\n- Wire：目标环境中的真实 REST/A2A 请求\n',check:'分别记录组件、装配、契约与协议证据，不用编译通过替代业务验证。'}

  }
  function saveCode(){const list=files(),id=state.role==='platform'?state.platformFile:state.file;const f=list.find(x=>x[0]===id)||list[0];const text=document.querySelector('#code-editor')?.value;
    if(!text?.trim()){toast('内容不能为空。');return;}
    if(text===f[2]){editorBuffer=null;toast('没有需要保存的修改。');return;}
    if(text.length>30000){toast('Demo 单文件上限为 30 KB。');return;}
    if(state.role==='platform'){if(id==='contract'){toast('开放契约通过配置建议维护。');return;}state.platform.rev++;if(id==='scene-skill')state.platform.skill=text;else if(id==='policy')state.platform.code=text;else state.platform.platformSkill=text;}
    else if(id==='config'){
      let data;try{data=JSON.parse(text);}catch{toast('JSON 格式错误，草稿未修改。');return;}
      if(!data||Array.isArray(data)||Object.keys(data).some(k=>!['name','model','rules'].includes(k))||typeof data.name!=='string'||!data.name.trim()||data.name.length>40||!['企业默认模型','轻量调试模型'].includes(data.model)||!data.rules||Object.keys(data.rules).some(k=>!['eligibility','maxQuantity'].includes(k))||typeof data.rules.eligibility!=='boolean'||!Number.isInteger(data.rules.maxQuantity)||data.rules.maxQuantity<1||data.rules.maxQuantity>3){toast('仅支持名称、模型及已开放规则；数量范围为 1～3。');return;}
      if(data.rules.eligibility&&!state.app.openRules){toast('当前模板尚未开放资格校验，请从平台新模板创建应用。');return;}

  function addEvent(run,name,status,detail,input={},output={}){run.events.push({name,status,detail,input,output,spanId:(run.events.length+2).toString(16).padStart(16,'0'),parentSpanId:'0000000000000001',durationMs:24+run.events.length*17});}
  function runScenario(){const query=document.querySelector('#debug-query')?.value.trim()||state.query;state.query=query;
    if(state.approval&&!state.approval.invalid){toast('请先完成或拒绝当前确认，再开始新的业务运行。');return;}
    const unresolved=state.runs.find(r=>r.status==='unknown');if(unresolved){state.activeRun=unresolved.id;render();toast('存在结果未知的兑换，请先查询原交易结果。');return;}
    state.approval=null;const seq=(state.runSequence||0)+1;state.runSequence=seq;const run={id:`demo-run-${String(seq).padStart(3,'0')}`,traceId:'d'.repeat(24)+seq.toString(16).padStart(8,'0'),query,revision:state.app.rev,snapshot:snapshot(),events:[],status:'running',simulation:true};
    addEvent(run,'应用快照','ok',`固定草稿 r${run.revision}、模板 ${state.app.template}`,{query},{revision:run.revision,template:state.app.template});
    addEvent(run,'意图与操作选择','ok','MOA 业务链路 · 预设分类，不调用模型',{query},{operation:/兑换|超时/.test(query)?'redeem_gift':'query_balance'});
    const raw=state.responseShape==='nested'?{data:{points:{available:state.business.balance}}}:{points:state.business.balance};
    addEvent(run,'福利接口 · query_balance','ok','本地夹具返回，不发送网络请求',{actor:'demo-user-01'},raw);
    const recognized=mapperReady()||state.app.script.trim()===OLD_SCRIPT.trim();
    if(!recognized||(state.responseShape==='nested'&&!mapperReady())){run.status='failed';run.answer=recognized?'接口已返回数据，但余额映射不符合输出契约。请检查 scripts/result_balance.py。':'脚本已被修改，当前演示器无法验证这段代码。请恢复示例或交给真实执行环境检查。';addEvent(run,'结果映射 · result_balance.py','failed',recognized?'缺少顶层 points；实际字段在 data.points.available':'自定义 Python 未执行',raw,{error:'OUTPUT_CONTRACT_INVALID'});}
    else{addEvent(run,'结果映射与输出校验','ok','可用 i豆字段符合演示契约',raw,{available:state.business.balance,unit:'i豆'});
      if(/兑换|超时/.test(query)){
        if(!state.app.eligibility){run.status='failed';run.answer='兑换前尚未装配资格检查。请通过 Coding Agent 或配置代码补齐。';addEvent(run,'资格校验','failed','缺少资格检查，阻断写入',{}, {writeCount:0});}
        else if(state.business.balance<gifts[state.app.gift].cost){run.status='rejected';run.answer='可用 i豆不足，本次没有提交兑换。';addEvent(run,'资格校验','failed','余额不足，零写入',{balance:state.business.balance,cost:gifts[state.app.gift].cost},{allowed:false});}
        else{run.status='waiting';run.answer='礼品符合兑换条件。请确认礼品和所需 i豆，确认后才会提交。';addEvent(run,'资格校验','ok','余额与数量检查通过',{balance:state.business.balance,gift:state.app.gift},{allowed:true});addEvent(run,'等待用户确认','waiting','确认绑定当前礼品与应用修订',{gift:state.app.gift,revision:state.app.rev},{waiting:true});state.approval={runId:run.id,revision:state.app.rev,gift:state.app.gift,timeout:/超时/.test(query),invalid:false};}

  function confirmRedemption(){const a=state.approval;if(!a)return;if(a.invalid||a.revision!==state.app.rev||a.gift!==state.app.gift){toast('确认已失效，请重新运行。');return;}const r=state.runs.find(x=>x.id===a.runId);if(!r)return;
    const existing=state.business.orders.find(o=>o.key===a.runId);if(existing){state.approval=null;render();toast('重复确认已忽略，没有新增订单。');return;}
    const gift=gifts[a.gift];if(state.business.balance<gift.cost){r.status='rejected';r.answer='提交时余额不足，没有写入。';state.approval=null;render();return;}
    state.business.balance-=gift.cost;const order={id:`DEMO-ORDER-${state.business.orders.length+1}`,key:a.runId,gift:a.gift,cost:gift.cost,status:'succeeded'};state.business.orders.push(order);
    addEvent(r,'用户确认','ok','确认参数与快照匹配',{gift:a.gift,revision:a.revision},{approved:true});
    addEvent(r,'提交兑换 · redeem_gift',a.timeout?'unknown':'ok',a.timeout?'模拟写入已完成，但调用方未收到结果':'同一业务标识只创建一笔演示订单',{idempotencyKey:a.runId,gift:a.gift},a.timeout?{status:'unknown'}:{orderId:order.id,status:order.status});
    r.status=a.timeout?'unknown':'succeeded';r.answer=a.timeout?'兑换请求已提交，但响应超时。结果未知，请查询原交易结果，不要重新提交。':`已兑换${gift.name}。订单 ${order.id}，剩余 ${state.business.balance} i豆。`;state.approval=null;render();
  }
  function runChecks(){const cases=[{name:'资格检查位于用户确认前',passed:state.app.eligibility},{name:'标准与嵌套余额返回均有映射',passed:mapperReady()},{name:'配置与业务 Skill 内容完整',passed:!!state.app.name.trim()&&!!state.app.businessSkill.trim()},{name:'无待确认或结果未知的业务',passed:!state.approval&&!state.runs.some(r=>r.status==='unknown')}];state.report={revision:state.app.rev,simulation:true,cases,passed:cases.every(x=>x.passed)};render();}
  function showPackage(){if(!state.candidate)return;openDialog('应用交付包 · 结构预览',`<div class="notice">这是目标交付结构。当前 Demo 只下载设计交接 JSON，不生成可执行 JAR 或源码工程。</div><pre class="release-tree spaced">ideabean-service/\n├── application.jar        目标产物，当前未生成\n├── assets/skills/         业务 Skill 与脚本\n├── config/                环境配置样例\n├── dependency-lock.json   运行依赖\n├── tests/                 场景测试\n└── README.md              启动与 CI 交接</pre><p>候选 ${esc(state.candidate.id)} · r${state.candidate.revision}。导出清单使用固定候选，后续草稿修改不会替换其内容。</p>`,btn('关闭','close')+btn('下载设计交接清单（JSON）','download','box','primary'));}
  function download(){const payload={schema:'agent-builder-design-handoff/v2',kind:'design-only',simulation:true,runnable:false,candidate:clone(state.candidate),note:'无 JAR、无真实 OpenCode/Java/CI 运行证据，不可作为部署包。'};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='ideabean-design-handoff.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已下载设计清单，不是可运行应用包。');}
  let playback=null,playTimer=null;
  function stopPlayback(){clearTimeout(playTimer);playTimer=null;if(playback)playback.playing=false;}
  function traceDialog(runId){stopPlayback();const run=state.runs.find(r=>r.id===runId);if(!run){toast('请先完成一次模拟运行。');return;}playback={runId,index:0,playing:false};renderReplay();}
  function renderReplay(){if(!playback)return;const r=state.runs.find(x=>x.id===playback.runId);if(!r)return;const e=r.events[playback.index];const max=Math.max(...r.events.map(x=>x.durationMs||1));openDialog('执行 Trace 与轨迹回放',`<div class="notice info">只读回放 · 仅重现保存的演示事件，不调用模型、工具或执行兑换。耗时与 Span 为模拟数据。</div><div class="row between wrap spaced"><span class="mono tiny">Trace ${esc(r.traceId)}</span>${tag(`快照 r${r.revision} / ${r.status}`)}</div><div class="two spaced"><div>${r.events.map((x,i)=>`<button class="span-row ${i===playback.index?'selected':''}" data-action="replay-step" data-index="${i}"><span>${i+1}. ${esc(x.name)}</span><span class="span-track"><i style="width:${Math.round((x.durationMs||1)/max*100)}%"></i></span><small>${x.durationMs}ms</small></button>`).join('')}</div><div class="panel pad"><h3>${esc(e.name)}</h3><div class="kv"><span>状态</span>${tag(e.status,e.status==='failed'?'red':'blue')}</div><div class="kv"><span>事件序号</span><strong>${playback.index+1} / ${r.events.length}</strong></div>${state.role==='platform'?`<div class="tiny mono muted">span_id: ${e.spanId}<br>parent_span_id: ${e.parentSpanId}</div>`:''}<div class="property"><label>输入</label><pre>${esc(JSON.stringify(e.input,null,2))}</pre></div><div class="property"><label>输出 / 错误</label><pre>${esc(JSON.stringify(e.output,null,2))}</pre></div><p class="tiny mt8">${esc(e.detail)}</p></div></div>`,btn('上一步','replay-prev','','small',playback.index?'':'disabled')+btn(playback.playing?'暂停':'播放',playback.playing?'replay-pause':'replay-play','play','primary small')+btn('下一步','replay-next','','small',playback.index<r.events.length-1?'':'disabled')+btn('关闭','close','','small'));}
  function playStep(){const r=state.runs.find(x=>x.id===playback?.runId);if(!r||!playback?.playing)return;if(playback.index>=r.events.length-1){stopPlayback();renderReplay();return;}playback.index++;renderReplay();playTimer=setTimeout(playStep,900);}
  function diagnosticsView(){return `<div class="section-title"><h2>应用执行与 Trace</h2>${tag('Core / Runtime 上报能力复用 · 设计')}</div><div class="notice info">当前数据来自本地模拟。真实方案将消费 Core tracerotel 与 Runtime 扩展的上报，关联应用版本、任务与工程变更；不重复建设采集 SDK。</div><div class="panel table-scroll spaced"><table><thead><tr><th>运行 / 应用</th><th>版本</th><th>结果</th><th>操作</th></tr></thead><tbody>${state.runs.length?state.runs.slice().reverse().map(r=>`<tr><td><strong>${esc(r.id)}</strong><small>${esc(r.query)}</small></td><td>r${r.revision}</td><td>${tag(r.status,r.status==='failed'?'red':'blue')}</td><td>${btn('Trace / 回放','trace','','small',`data-id="${r.id}"`)}</td></tr>`).join(''):'<tr><td colspan="4">场景开发者运行一次应用后，可在这里联合定位。</td></tr>'}</tbody></table></div>`;}
  function reviewProposal(){const p=currentCoding().proposal;if(!p)return;openDialog('编排与代码差异',`<p>${esc(p.title)} · 基于 r${p.baseRevision}</p><div class="diff"><div class="diff-label">修改前</div><pre class="before">${esc(p.before)}</pre><div class="diff-label">修改后</div><pre class="after">${esc(p.after)}</pre></div><p class="spaced">${esc(p.check)}</p>`,btn('返回','close')+btn('应用变更到草稿','apply-proposal','check','primary'));}
  function askAgent(){const text=document.querySelector('#agent-prompt')?.value.trim();if(!text){toast('请描述目标，或选择上方示例。');return;}const kind=state.role==='platform'?(/验证|契约测试|检查步骤/.test(text)?'guide':/开放|资格|装配/.test(text)?'scope':null):(/接口|映射|返回/.test(text)?'mapping':/资格|余额检查|校验|库存/.test(text)?'eligibility':/确认|说明|文案/.test(text)?'wording':null);if(kind)prepareProposal(kind,text);else toast('这是预设交互 Demo，请使用上方建议体验；自由目标需要后续真实 OpenCode 接入。');}
  function tour(){openDialog('MOA → i豆 · 双角色演示路线',`<ol class="tour-list"><li>切到平台工作区，让 Coding Agent 开放资格校验；查看差异并应用。</li><li>检查开放契约，发行模板，再以场景开发者接手并创建应用。</li><li>请 Agent 增加资格检查；查看配置代码，或手工修改名称。</li><li>联合调试：查余额；切换嵌套接口返回，定位失败，再让 Agent 修复映射。</li><li>兑换礼品，确认后查看订单；也可体验写后超时与原交易核对。</li><li>打开 Trace，逐步播放输入、输出及错误，观察订单数保持不变。</li><li>运行示例检查，固定候选，预演交付企业 CI/CD。</li></ol><div class="notice info">全部业务、Agent 建议、Trace 与交付均为模拟。可直接查看或修改代码；真实后端属于后续阶段。</div>`,btn('重置本 Demo','reset-request','','ghost')+btn('从平台工作区开始','start-tour','arrow','primary'));}
  function publish(){if(state.platform.checked!==state.platform.rev){toast('请先检查当前工程修订。');return;}const n=(state.platform.releaseSequence||0)+1;state.platform.releaseSequence=n;state.platform.templateVersion=`1.${2+n}.0`;state.platform.skillVersion=`demo-1.${n}`;state.platform.published={skill:state.platform.skill,openRules:state.platform.openRules,revision:state.platform.rev};render();toast('新示例模板已发行；已有应用仍固定原版本。');}
  function createApp(){openDialog('从模板创建 i豆应用',`<div class="field"><label for="new-app-name">应用名称</label><input class="input" id="new-app-name" maxlength="40" value="i豆服务助手"></div><p>固定模板 ${state.platform.templateVersion} 与开发 Skill ${state.platform.skillVersion}。</p><div class="notice">Demo 只保留一个活动应用。继续会替换本 Demo 的当前草稿、模拟订单和运行记录；不会修改实际服务或原设计稿。</div>`,btn('取消','close')+btn('创建演示应用','create-confirm','plus','primary'));}
  function createConfirm(){const name=document.querySelector('#new-app-name')?.value.trim();if(!name){toast('请填写应用名称。');return;}state.app={...clone(DEFAULT.app),name,template:state.platform.templateVersion,devSkill:`moa-scene-dev@${state.platform.skillVersion}`,devSkillContent:state.platform.published?.skill||SCENE_SKILL,openRules:state.platform.published?.openRules||false};state.runs=[];state.activeRun=null;state.approval=null;state.report=null;state.candidate=null;state.delivery=null;state.undo=null;state.business=clone(DEFAULT.business);state.coding.scene=clone(DEFAULT.coding.scene);state.responseShape='standard';state.query=DEFAULT.query;state.role='scene';state.view='workspace';state.tab='overview';closeDialog();render();}
  const preserveEditor=new Set(['save-code','restore-code','skill-detail','review-proposal','close','tour','reset-request','reset-confirm']);
  document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;
    if(editorBuffer!==null&&!preserveEditor.has(a)){toast('代码有未保存修改，请先保存或恢复当前文件。');return;}
    switch(a){
      case 'role':state.role=b.dataset.role;render();break;
      case 'tab':state.view='workspace';state.tab=b.dataset.id;render();break;
      case 'view':state.role='scene';state.view=b.dataset.id;render();break;
      case 'platform-tab':state.platformTab=b.dataset.id;render();break;
      case 'platform-code':state.platformTab='code';render();break;
      case 'edit-dev-skill':state.platformTab='code';state.platformFile='scene-skill';render();break;
      case 'file':if(state.role==='platform')state.platformFile=b.dataset.id;else state.file=b.dataset.id;render();break;
      case 'open-code':state.view='workspace';state.tab='extensions';state.file='config';render();break;
      case 'edit-mapping':state.tab='extensions';state.file='mapping';render();break;
      case 'goto-debug':state.view='workspace';state.tab='debug';render();break;
      case 'select-op':selectedOp=b.dataset.id;state.tab='operations';render();break;
      case 'save-config':{const name=document.querySelector('#app-name')?.value.trim();const model=document.querySelector('#model')?.value;if(!name){toast('应用名称不能为空。');break;}if(name!==state.app.name||model!==state.app.model){changed('修改应用配置');Object.assign(state.app,{name,model});render();}toast('应用配置已保存。');break;}
      case 'save-code':saveCode();break;
      case 'restore-code':editorBuffer=null;render();toast('已恢复到当前保存的文件。');break;
      case 'undo':if(state.undo){const rev=state.app.rev+1,previous=clone(state.undo);changed('撤销');state.app={...previous,rev,lastChange:'撤销最近修改'};state.undo=null;render();toast('已撤销；新修订需要重新检查。');}break;
      case 'suggest':prepareProposal(b.dataset.kind);break;
      case 'ask-agent':askAgent();break;
      case 'review-proposal':reviewProposal();break;
      case 'apply-proposal':applyProposal();break;
      case 'discard-proposal':currentCoding().proposal=null;render();break;
      case 'skill-detail':skillDetail();break;
      case 'preset-query':state.query={balance:'查询我的 i豆余额',redeem:'帮我兑换这个礼品',timeout:'兑换礼品，模拟写后超时'}[b.dataset.query];render();break;
      case 'run':runScenario();break;
      case 'confirm':confirmRedemption();break;
      case 'reject':{const r=state.runs.find(x=>x.id===state.approval?.runId);if(r){r.status='rejected';r.answer='用户拒绝，本次没有提交兑换。';addEvent(r,'用户拒绝','rejected','未调用写操作',{}, {writeCount:0});}state.approval=null;render();break;}
      case 'reconcile':{const r=state.runs.find(x=>x.id===state.activeRun);if(r?.status!=='unknown')break;const order=state.business.orders.find(o=>o.key===r.id);if(order){r.status='succeeded';r.answer=`原交易已成功：${order.id}。核对没有新增订单。`;addEvent(r,'核对原兑换结果','ok','只查询原业务标识，没有再次写入',{idempotencyKey:r.id},{orderId:order.id,status:order.status});}render();break;}
      case 'debug-fix':{const r=state.runs.find(x=>x.id===state.activeRun);prepareProposal(r?.events.some(e=>e.name.includes('映射')&&e.status==='failed')?'mapping':'eligibility');break;}
      case 'run-history':state.activeRun=b.dataset.id;render();break;
      case 'test':runChecks();break;
      case 'candidate':if(reportCurrent()){state.candidate={id:`candidate-demo-r${state.app.rev}`,revision:state.app.rev,snapshot:snapshot(),report:clone(state.report)};render();}break;
      case 'package':showPackage();break;
      case 'download':if(state.candidate)download();break;
      case 'ci':if(reportCurrent()&&state.candidate?.revision===state.app.rev){state.delivery={simulation:true,candidateId:state.candidate.id,revision:state.app.rev};render();}break;
      case 'independence':openDialog('独立运行 · 验收动作预演','<p>真实交付需停掉工作台、专用 Runner 与 Builder 代理，再直接调用导出服务，核对余额、兑换与异常结果。</p><div class="notice">当前没有启动或停止任何服务，没有生成 JAR，也没有执行独立运行验收。</div>',btn('返回','close','','primary'));break;
      case 'platform-check':if(state.platform.skill.includes('可写')&&state.platform.platformSkill.includes('service/')&&state.platform.openRules){state.platform.checked=state.platform.rev;render();toast('示例契约检查通过；真实注册、API 与版本兼容尚未验证。');}else toast('请先开放资格校验，并保留开发 Skill 的可写范围和工程分层指导。');break;
      case 'publish':publish();break;
      case 'handoff':state.role='scene';state.view='templates';render();break;
      case 'create-app':createApp();break;
      case 'create-confirm':createConfirm();break;
      case 'tour':tour();break;
      case 'start-tour':state.role='platform';state.platformTab='engineering';closeDialog();render();break;
      case 'reset-request':openDialog('重置本 Demo','<p>只清除本设计稿的草稿、对话、模拟订单和运行记录，回到初始状态。</p>',btn('取消','close')+btn('确认重置','reset-confirm','','primary'));break;
      case 'reset-confirm':closeDialog();state=clone(DEFAULT);editorBuffer=null;playback=null;render();break;
      case 'trace':traceDialog(b.dataset.id||state.activeRun);break;
      case 'replay-step':stopPlayback();playback.index=Number(b.dataset.index);renderReplay();break;
      case 'replay-prev':stopPlayback();playback.index=Math.max(0,playback.index-1);renderReplay();break;
      case 'replay-next':stopPlayback();playback.index=Math.min(state.runs.find(r=>r.id===playback.runId).events.length-1,playback.index+1);renderReplay();break;
      case 'replay-play':stopPlayback();if(playback.index===state.runs.find(r=>r.id===playback.runId).events.length-1)playback.index=0;playback.playing=true;renderReplay();playTimer=setTimeout(playStep,900);break;
      case 'replay-pause':stopPlayback();renderReplay();break;
      case 'close':closeDialog();break;
    }
  });
  document.addEventListener('input',event=>{if(event.target.id==='code-editor')editorBuffer=event.target.value;if(event.target.id==='debug-query'){state.query=event.target.value;persist();}});
  document.addEventListener('change',event=>{if(event.target.id==='response-shape'){state.responseShape=event.target.value;persist();}if(event.target.id==='gift-choice'){changed('修改兑换礼品，旧确认失效');state.app.gift=event.target.value;render();}});
  document.querySelector('#dialog').addEventListener('cancel',stopPlayback);
  render();
})();

</script>
</body>
</html>
