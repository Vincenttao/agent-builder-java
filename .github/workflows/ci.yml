name: Platform checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  java-adapter:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1-bookworm@sha256:cc9f4143a8d2fa8cf3749d0cb4d26ecf2d53a77a2ac807e9ebd67ae22426221a
        env:
          POSTGRES_USER: builder_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: builder_test
        ports: ['15432:5432']
        options: --health-cmd="pg_isready -U builder_test -d builder_test" --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build pinned upstream dependencies and verify the bridge
        shell: pwsh
        run: ./scripts/bootstrap-java.ps1
      - run: pnpm test:live:adapters --reporter=default --reporter=json --outputFile=test-results/adapters.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-adapter-test-evidence
          path: |
            java/runtime-bridge/target/surefire-reports/
            test-results/adapters.json
          if-no-files-found: warn
  deterministic:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1-bookworm@sha256:cc9f4143a8d2fa8cf3749d0cb4d26ecf2d53a77a2ac807e9ebd67ae22426221a
        env:
          POSTGRES_USER: builder_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: builder_test
        ports: ['15432:5432']
        options: --health-cmd="pg_isready -U builder_test -d builder_test" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      DATABASE_URL: postgres://builder_test:local-test-only@127.0.0.1:15432/builder_test
      LOCAL_BOOTSTRAP_TOKEN: ci-only-ephemeral-token-for-local-service
      APP_ORIGIN: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test --reporter=default --reporter=json --outputFile=test-results/core.json
      - run: pnpm test:integration --reporter=default --reporter=json --outputFile=test-results/postgres.json
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser against real app and database
        run: |
          # Match deploy/Dockerfile: tsc output alone cannot resolve pnpm workspace dependencies.
          pnpm --filter @agent-builder/server deploy --prod .cache/ci-server
          cp -R dist .cache/ci-server/dist
          mkdir -p .cache/ci-server/apps/web
          cp -R apps/web/dist .cache/ci-server/apps/web/dist
          cp -R db .cache/ci-server/db
          mkdir -p test-results
          (
            cd .cache/ci-server
            node dist/apps/server/src/main.js > "$GITHUB_WORKSPACE/test-results/ci-server.log" 2>&1
          ) &
          node scripts/wait-ready.mjs
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-test-evidence
          path: test-results/
          if-no-files-found: error
