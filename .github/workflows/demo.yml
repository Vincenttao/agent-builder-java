name: Demo checks
on:
  push:
    branches: [demo/prd-v2-workbench]
  pull_request:
    branches: [demo/prd-v2-workbench]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  clickable-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:demo
      - run: npm run test:flow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-check-evidence
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
